name: release

# Manual run: Actions -> release -> Run workflow -> version like v2.2.0.
# The tag is created automatically at the current main HEAD.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (no suffix, e.g. v2.2.0)"
        required: true
        default: "v2.2.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version format (vX.Y.Z, no suffix)
        run: |
          v="${{ inputs.version }}"
          echo "$v" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version must look like v2.2.0 (no trailing b), got: $v"; exit 1; }

      - name: C-SKY toolchain (csky-elfabiv2 V3.10.33, linux x86_64)
        run: |
          git clone --depth 1 https://github.com/I-AM-ENGINEER/csky-toolchain.git /tmp/tcrepo
          mkdir -p "$GITHUB_WORKSPACE/tc"
          tar xzf /tmp/tcrepo/linux/csky-elfabiv2-tools-x86_64-minilibc-20250328.tar.gz -C "$GITHUB_WORKSPACE/tc"
          "$GITHUB_WORKSPACE/tc/bin/csky-elfabiv2-gcc" --version

      - name: python alias
        run: |
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python
          python --version

      - name: Build (host-test gate, firmware, pack)
        run: |
          make prebuild
          make COMPILER_DIR="$GITHUB_WORKSPACE/tc" -j"$(nproc)"

      - name: Package release tar (fw.bin + www/, plain tar)
        run: |
          TAG="${{ inputs.version }}"
          NAME="RNode-Halow-${TAG//./_}"
          tar -cf "${NAME}.tar" -C out fw.bin -C "$PWD/out/_filesystem" www
          tar -tvf "${NAME}.tar"
          sha256sum "${NAME}.tar" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Raw OTA image + crc32 sidecar (github auto-update assets)
        run: |
          TAG="${{ inputs.version }}"
          NAME="RNode-Halow-${TAG//./_}"
          cp -v out/fw.bin "${NAME}.fw.bin"
          # CRC-32 (IEEE, same polynomial as the firmware's ota_update check),
          # lowercase hex text — the sidecar ota_update.c fetches as
          # "<asset>.crc32" before flashing.
          python3 -c "import binascii,sys; print('%08x' % (binascii.crc32(open(sys.argv[1],'rb').read()) & 0xffffffff))" \
            "${NAME}.fw.bin" > "${NAME}.fw.bin.crc32"
          cat "${NAME}.fw.bin.crc32"
          ls -la "${NAME}.fw.bin"*

      - name: Publish full release (tag auto-created, placeholder body)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          body: PLACEHOLDER
          files: |
            RNode-Halow-*.tar
            RNode-Halow-*.fw.bin
            RNode-Halow-*.fw.bin.crc32
