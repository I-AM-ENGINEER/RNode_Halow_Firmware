        bin: ""
        commandLine: python ${workspaceFolder}/flasher/cklnk-flasher.py ${OutDir}/${ProjectName}.elf --reset
        eraseChipCommand: ""
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
    uploader: Custom
