    settings:
      debugger: cortex-debug
    toolchain: ANY_GCC
    toolchainConfigMap:
      ANY_GCC:
        linkerScriptPath: gcc_csky.ld
        options:
          version: 2
          afterBuildTasks:
            - name: Create bin
              abortAfterFailed: false
              command: ${ToolchainRoot}/bin/${CompilerPrefix}objcopy -O binary ${OutDir}/${ProjectName}.elf ${OutDir}/${ProjectName}.bin
              disable: false
            - name: Compress bin
              abortAfterFailed: false
              command: python pack/prepare_firmware.py ${OutDir}/${ProjectName}.bin -o out/fw.bin
              disable: false
            - name: Create OTA
              abortAfterFailed: false
              command: python pack/build_OTA.py out out/fw.bin
              disable: false
          asm-compiler:
            ASM_FLAGS: -mcpu=ck803 -g -pipe -D__NO_BOARD_INIT -DTXW4002ACK803
          beforeBuildTasks:
            - name: mkdir out
              abortAfterFailed: false
              command: rm -rf "out" && mkdir "out"
              disable: false
              stopBuildAfterFailed: true
          c/cpp-compiler:
            CXX_FLAGS: -D_GLIBCXX_USE_C99_STDIO
            C_FLAGS: -mcpu=ck803 -Os -g -Wall -ffunction-sections -fdata-sections -Wno-comment -Wno-unused-function -Wno-unused-but-set-variable -mno-required-printf -pipe -D__NO_BOARD_INIT -DTXW4002ACK803 -DSKBPOOL_ENABLE -DMPOOL_ALLOC -DCONFIG_UMAC4
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            signed-char: true
            warnings: unspecified
          global:
            output-debug-info: enable
          linker:
            $disableOutputTask: true
            LD_FLAGS: -mcpu=ck803 -nostartfiles -Wl,--gc-sections -Wl,-zmax-page-size=1024 -Wl,-Map=project.map -Wl,--ckmap=txw4002a.map -Wl,--wrap=lwip_netif_hook_inputdata -Wl,--wrap=lmac_send_bss_announcement -Wl,--wrap=ah_rfspi_write -Wl,--wrap=ah_rfspi_read
            LIB_FLAGS: libs/obj/libcommon/common_c_misc.o libs/obj/libcommon/common_sleepcb.o libs/obj/libcommon/common_sysevt.o libs/obj/libcommon/heap_mmpool.o libs/obj/libcommon/heap_sysheap.o libs/obj/libcommon/ota_eth_ota.o libs/obj/libcommon/ota_fw.o libs/obj/libcommon/ota_fwinfo.o libs/obj/libcommon/skb_skb_list.o libs/obj/libcommon/skb_skb_pool.o libs/obj/libcommon/syscfg_syscfg.o libs/obj/libcommon/xmodem_xmodem.o libs/obj/libcommon/xmodem_xmodem_fw.o libs/obj/libcore/emac_hg_gmac_eva.o libs/obj/libcore/slave_hgsdio20_slave.o libs/obj/libcore/txw4002ack803_startup.o libs/obj/libcore/txw4002ack803_sysctrl.o libs/obj/libcore/usb11_hgusb11_base.o libs/obj/libcore/usb11_hgusb11_dev_api.o libs/obj/libcore/usb11_hgusb11_dev_ep0.o libs/obj/libcore/usb11_hgusb11_dev_tbl.o libs/obj/liblmac/lmac_lmac_rxq.o libs/obj/liblmac/mars_ah_dsleep.o libs/obj/liblmac/mars_ah_wphy.o libs/obj/liblmac/mars_ah_wphy_parameter_v2.o libs/obj/liblmac/mars_ahrf.o libs/obj/liblmac/mars_ahrf_iq_curve.o
              libs/obj/liblmac/mars_ahrf_parameter.o libs/obj/liblmac/mars_dbgpath.o libs/obj/liblmac/mars_dbgpath_parameter_v2.o libs/obj/liblmac/mars_lmac.o libs/obj/liblmac/mars_lmac_cfg.o libs/obj/liblmac/mars_lmac_cipher.o libs/obj/liblmac/mars_lmac_hw.o libs/obj/liblmac/mars_lmac_rc.o libs/obj/liblmac/mars_lmac_rx.o libs/obj/liblmac/mars_lmac_test.o libs/obj/liblmac/mars_lmac_tx.o libs/obj/liblmac/mars_lmac_util.o libs/obj/liblmac/mars_rfdigicali.o libs/obj/liblmac/mars_tdma.o libs/obj/libnetutils/dhcpd_dhcpd.o libs/obj/libnetutils/utils_chksum.o libs/obj/libnetutils/utils_dnsred.o libs/obj/libnetutils/utils_netat.o libs/obj/libnetutils/utils_netlog.o libs/obj/libnetutils/utils_sntp.o libs/obj/libnetutils/utils_udp.o libs/obj/libnetutils/utils_wnbota.o libs/obj/libosal/csky_condv.o libs/obj/libosal/csky_msgqueue.o libs/obj/libosal/csky_mutex.o libs/obj/libosal/csky_semaphore.o libs/obj/libosal/csky_sleep.o libs/obj/libosal/csky_task.o libs/obj/libosal/csky_time.o
              libs/obj/libosal/csky_timer.o libs/obj/libosal/osal_work.o -lm
            linker-type: gcc
            output-format: elf
            print-mem-usage: true
            remove-unused-input-sections: true
